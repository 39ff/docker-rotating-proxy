version: "3.4"
services:
  squid:
    ports:
      - 3128:3128
    build:
      context: ./squid_patch
      dockerfile: Dockerfile
    image: squid-socks:6.10
    volumes:
      - './config:/etc/squid/conf.d:ro'
    container_name: dockersquid_rotate
    environment:
      - 'SQUID_CONFIG_FILE=/etc/squid/conf.d/squid.conf'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD-SHELL", "export https_proxy=127.0.0.1:3128 && export http_proxy=127.0.0.1:3128 && curl -sf -o /dev/null http://httpbin.org/ip || exit 1" ]
      retries: 5
      timeout: "10s"
      start_period: "60s"
      interval: "300s"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
